name: Release

# Pushing an annotated vMAJOR.MINOR.PATCH tag on main builds Kuvo Code, attaches the
# disk image and the update feed to a draft release, and publishes the release
# once both are uploaded.
#
# The release notes, on the release page and in the app's update window, are the
# version's section of CHANGELOG.md. Before tagging, rename its "## Unreleased"
# heading to the version, like "## 0.1.0"; a tag without notes fails right away.
#
# A beta is a vMAJOR.MINOR.PATCH-beta.N tag on main, like v0.7.0-beta.1: the version
# it leads up to. It's published as a prerelease, never the latest, with the
# Unreleased notes as they are; only copies with Settings › General › Get beta
# updates on are offered it. The update feed holds the newest release and, when
# it's newer, the newest beta (scripts/merge-appcast.py); a beta's feed also
# replaces the newest release's, which is where installed copies read it.
#
# Every release is signed with a Developer ID and notarized, so macOS opens it
# without a warning; the workflow stops if any of these secrets is missing.
#   MACOS_CERTIFICATE_P12       base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD  password of that .p12
#   MACOS_SIGNING_IDENTITY      the certificate's SHA-1 fingerprint, from
#                               `security find-identity -v -p codesigning`; safer
#                               than its name, which codesign misses when the name
#                               has accented letters
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarytool
#
# Every release also needs SPARKLE_PRIVATE_KEY, the EdDSA key that signs the
# update feed (appcast.xml). Installed copies of Kuvo Code only accept updates
# signed with it. With KUVO_BOX_SIGNING_KEY (an Ed25519 key, PEM) it also
# publishes what remote machines run, for them to update themselves with
# (boxes.json and box-<version>.tar.gz); machines take only what's signed with a
# key pinned in the box's link (UPDATE_KEYS, in Packages/Box/src). scripts/set-box-key.sh makes that
# key once, keeps it in your login keychain, uploads it and prints the key to pin. scripts/set-update-key.sh uploads it; the signing and
# notarization secrets come from scripts/set-signing-secrets.sh and
# scripts/set-notary-secrets.sh.
#
# Running it by hand (Actions › Release › Run workflow) on main is a dry run: it
# signs, notarizes and checks the app with Gatekeeper, then uploads it as a
# workflow artifact instead of publishing a release. Use it to check the secrets,
# and the release build itself, which CI doesn't make on every push.
#
# The signing job runs in the `release` environment. GitHub makes one with no rules
# if it doesn't exist, so set it up in Settings › Environments before the next
# release: deployments from main and v* tags only, and the secrets above kept there
# rather than in the repository's, where any branch's workflow could read them.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
  workflow_dispatch:

# One at a time, releases and betas alike: each writes the update feed from the one before. A
# dry run waits in a line of its own, so starting one never cancels a release waiting its turn.
concurrency:
  group: ${{ github.event_name == 'push' && 'release' || format('release-dry-run-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Beside CI's jobs, so a wrong tag fails in seconds.
  verify:
    name: verify release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The checks below ask the remote about the tag and main, which a private
          # repository only answers with the job's read-only token.
          persist-credentials: true

      - name: Check a dry run is from main
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "A dry run signs with the release secrets, so it runs only from main." >&2
            exit 1
          fi

      - name: Check the tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "Release tags must look like vMAJOR.MINOR.PATCH, or vMAJOR.MINOR.PATCH-beta.N for a beta." >&2
            exit 1
          fi

          tag_ref="refs/tags/$GITHUB_REF_NAME"
          tag_oid="$(git ls-remote --tags origin "$tag_ref" | awk 'NR == 1 { print $1 }')"
          peeled_oid="$(git ls-remote --tags origin "$tag_ref^{}" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$tag_oid" || -z "$peeled_oid" ]]; then
            echo "Release tags must be annotated (git tag -a)." >&2
            exit 1
          fi
          if [[ "$peeled_oid" != "$(git rev-parse HEAD)" ]]; then
            echo "The release tag does not resolve to the checked-out commit." >&2
            exit 1
          fi

          # Releases come from main, but main may move on while a release builds.
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tags must point at a commit on main." >&2
            exit 1
          fi

  release:
    name: build and publish
    needs: [ci, verify]
    # Only a v* tag (which verify checked is on main) or a dry run from main gets the secrets.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: xcode-27
    # Limited in GitHub settings to main and v* tags, and holding the secrets (see the top).
    environment: release
    # Building takes about 20 minutes and each notarization a few; a hung one mustn't run for hours.
    timeout-minutes: 120
    permissions:
      contents: write
    # Each secret goes only to the steps that use it, not to the actions (checkout, setup-node,
    # upload-artifact) as well. No caches either: what's signed is built from the checkout alone.
    env:
      # The certificate's fingerprint, which names it; not a key.
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      HAS_BOX_SIGNING_KEY: ${{ secrets.KUVO_BOX_SIGNING_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # For signing the box release (scripts/sign-box.mjs), the same pinned Node everywhere.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Choose the version
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          # Without the update key, installed copies could never update past this release.
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "The SPARKLE_PRIVATE_KEY secret is missing." >&2
            exit 1
          fi
          # Notes come from CHANGELOG.md; checked now so a tag without them fails in seconds.
          # A beta's are what's under Unreleased so far.
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" == *-beta.* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "BETA=true" >> "$GITHUB_ENV"
            ./scripts/release-notes.sh Unreleased > "$RUNNER_TEMP/notes.md"
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            ./scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          else
            # A dry run shows the newest notes, or a placeholder before there are any.
            ./scripts/release-notes.sh > "$RUNNER_TEMP/notes.md" || echo "Dry run." > "$RUNNER_TEMP/notes.md"
            echo "VERSION=0.0.0" >> "$GITHUB_ENV"
          fi
          # Unsigned or unnotarized builds make macOS warn people, so none go out.
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "The $name secret is missing." >&2
              exit 1
            fi
          done

      - name: Import the signing certificate
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          # Add ours to the search list, keeping the keychains already there.
          existing=()
          while IFS= read -r line; do
            existing+=("$(sed 's/^ *"//; s/"$//' <<< "$line")")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Build the app
        shell: bash
        run: |
          set -euo pipefail
          # What's New as the changelog has it now (its section named for this version).
          python3 scripts/whats-new.py
          SIGN_IDENTITY="$MACOS_SIGNING_IDENTITY" ./scripts/build-app.sh

      # What every box runs, for machines to update themselves with (Packages/KuvoLink/PROTOCOL.md,
      # "Updates"): the files this version puts on every box, with the app's helper bundles, packed,
      # and boxes.json, a manifest naming the pack and the engine's builds, signed. It goes in the
      # app (Contents/Resources/box-release), which offers it to this Mac's box as it updates, before
      # the app's signed again and notarized; "Package the box release" publishes the same files.
      # Without the key, there's none, and machines update only as a Mac connects.
      - name: Put the box release in the app
        if: env.HAS_BOX_SIGNING_KEY == 'true'
        shell: bash
        env:
          KUVO_BOX_SIGNING_KEY: ${{ secrets.KUVO_BOX_SIGNING_KEY }}
        run: |
          set -euo pipefail
          SIGN_IDENTITY="$MACOS_SIGNING_IDENTITY" \
            BOX_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/box-$VERSION.tar.gz" \
            ./scripts/app-box-release.sh "build/Kuvo Code.app" "$VERSION"

      # (CI checked these on every push while it built the app; only releases build it now.)
      - name: Check the app bundle
        shell: bash
        run: |
          set -euo pipefail
          app="build/Kuvo Code.app"
          for file in Assets.car AppIcon.icns LICENSE NOTICE THIRD_PARTY_LICENSES.txt prism-bundle.js buildDomTree.js kuvo-agents.js kuvo-browser.js; do
            test -f "$app/Contents/Resources/$file" || { echo "Missing $file in the app bundle" >&2; exit 1; }
          done
          test -d "$app/Contents/Frameworks/Sparkle.framework" || { echo "Sparkle isn't embedded" >&2; exit 1; }
          for key in SUFeedURL SUPublicEDKey; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$app/Contents/Info.plist" >/dev/null \
              || { echo "Info.plist is missing $key" >&2; exit 1; }
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = run.kuvo.code \
            || { echo "Unexpected bundle identifier" >&2; exit 1; }
          if [[ "$HAS_BOX_SIGNING_KEY" == true ]]; then
            for file in boxes.json "box-$VERSION.tar.gz"; do
              test -s "$app/Contents/Resources/box-release/$file" || { echo "Missing box-release/$file in the app bundle" >&2; exit 1; }
            done
          fi
          codesign --verify --strict --deep --verbose=2 "$app"
          codesign -d --verbose=2 "$app" 2>&1 | grep -q 'flags=.*runtime' \
            || { echo "The hardened runtime is off" >&2; exit 1; }

      - name: Notarize
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "build/Kuvo Code.app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "build/Kuvo Code.app"
          # The same check macOS makes when someone opens the download.
          spctl --assess --type execute --verbose=2 "build/Kuvo Code.app"

      # The download: a disk image with the app and a link to Applications.
      # It's notarized on its own, so it opens without a warning too.
      - name: Build the disk image
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          SIGN_IDENTITY="$MACOS_SIGNING_IDENTITY" ./scripts/build-dmg.sh
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" build/KuvoCode.dmg >/dev/null
          trap 'hdiutil detach "$mount" >/dev/null 2>&1 || true' EXIT
          test -d "$mount/Kuvo Code.app" || { echo "Kuvo Code.app is missing from the disk image" >&2; exit 1; }
          test "$(readlink "$mount/Applications")" = /Applications || { echo "The Applications link is missing" >&2; exit 1; }
          hdiutil detach "$mount" >/dev/null
          trap - EXIT
          xcrun notarytool submit build/KuvoCode.dmg \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple build/KuvoCode.dmg
          spctl --assess --type open --context context:primary-signature --verbose=2 build/KuvoCode.dmg

      - name: Package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "build/Kuvo Code.app/Contents/Info.plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "build/Kuvo Code.app/Contents/Info.plist")" = "$(./scripts/build-version.sh "$VERSION")"
          # A release is two files: the disk image people download and the update
          # feed installed copies read. Updates install from the same disk image.
          # The license notices travel inside the app.
          mkdir dist
          # Unversioned, so kuvo.run/code can always link to releases/latest/download/KuvoCode.dmg.
          cp build/KuvoCode.dmg dist/KuvoCode.dmg
          ./scripts/appcast.sh "$VERSION" dist/KuvoCode.dmg \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/KuvoCode.dmg" "$RUNNER_TEMP/notes.md" > "$RUNNER_TEMP/item.xml"
          # With the newest of the other kind from the feed that's out, on the newest release.
          # None before the first release; one that lost its feed starts it again. Anything
          # else (GitHub not answering) stops here rather than leave betas or releases out.
          mkdir "$RUNNER_TEMP/current"
          if [[ "$GITHUB_EVENT_NAME" != push ]]; then
            : # A dry run shows the feed of what it built.
          elif latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>"$RUNNER_TEMP/view.err")"; then
            if ! gh release download "$latest" --repo "$GITHUB_REPOSITORY" --pattern appcast.xml --dir "$RUNNER_TEMP/current" 2>"$RUNNER_TEMP/download.err"; then
              grep -qi "no assets match" "$RUNNER_TEMP/download.err" || { cat "$RUNNER_TEMP/download.err" >&2; exit 1; }
              echo "$latest has no update feed: this one starts it again." >&2
            fi
          elif ! grep -qi "release not found" "$RUNNER_TEMP/view.err"; then
            cat "$RUNNER_TEMP/view.err" >&2
            exit 1
          fi
          python3 ./scripts/merge-appcast.py "$RUNNER_TEMP/item.xml" "$RUNNER_TEMP/current/appcast.xml" > dist/appcast.xml
          cat dist/appcast.xml

      - name: Package the box release
        # The box's release the app carries ("Put the box release in the app"), the very same
        # files, for machines to download.
        if: env.HAS_BOX_SIGNING_KEY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp "build/Kuvo Code.app/Contents/Resources/box-release/boxes.json" \
            "build/Kuvo Code.app/Contents/Resources/box-release/box-$VERSION.tar.gz" dist/

      - name: Upload the dry-run build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KuvoCode-dry-run
          path: dist/
          retention-days: 3

      - name: Publish the release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != true ]]; then
              echo "A published release already exists for $GITHUB_REF_NAME." >&2
              exit 1
            fi
            gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes
          fi

          if [[ "${BETA:-}" == true ]]; then
            { printf 'A beta of what comes next, for trying it out before it’s released: Kuvo Code offers it with Settings › General › Get beta updates on.\n\n'; cat "$RUNNER_TEMP/notes.md"; } > "$RUNNER_TEMP/beta-notes.md"
            mv "$RUNNER_TEMP/beta-notes.md" "$RUNNER_TEMP/notes.md"
          fi
          printf '\n\nRequires macOS 26 or later on Apple silicon. Signed with a Developer ID and notarized by Apple.\n' >> "$RUNNER_TEMP/notes.md"
          kind=()
          if [[ "${BETA:-}" == true ]]; then kind=(--prerelease); fi
          # --generate-notes adds the link to the full list of commits after these notes.
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --draft ${kind[@]+"${kind[@]}"} --title "Kuvo Code ${GITHUB_REF_NAME#v}" --generate-notes \
            --notes-file "$RUNNER_TEMP/notes.md"

          expected="$(find dist -type f -exec basename {} \; | sort)"
          actual="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)"
          if [[ "$expected" != "$actual" ]]; then
            echo "Uploaded assets don't match:" >&2
            diff <(echo "$expected") <(echo "$actual") >&2 || true
            exit 1
          fi

          if [[ "${BETA:-}" != true ]]; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          else
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
            # Installed copies read the newest release's feed, so the beta goes there too. The
            # upload replaces the feed by taking the old one off first: checked, and tried again,
            # so that release isn't left without one.
            latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
            for attempt in 1 2 3; do
              if gh release upload "$latest" dist/appcast.xml --repo "$GITHUB_REPOSITORY" --clobber; then break; fi
              if [[ $attempt == 3 ]]; then
                if gh release view "$latest" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx appcast.xml; then
                  echo "$latest still has its old feed, without this beta: upload dist/appcast.xml there by hand." >&2
                else
                  echo "$latest is left without its update feed: upload dist/appcast.xml there by hand." >&2
                fi
                exit 1
              fi
              sleep 10
            done
          fi
