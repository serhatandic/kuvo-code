name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request, main, or a ci/ branch cancels the run it supersedes. A release's run
# (release.yml calls this workflow, and `github` is the caller's there, so github.workflow is
# "Release") is in a group of its own and is never cancelled.
concurrency:
  group: ${{ github.workflow == 'CI' && format('ci-{0}', github.ref) || format('ci-release-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.workflow == 'CI' }}

# Every job runs on GitHub's hosted runners, side by side. Xcode's runner images are named for the
# Xcode version they ship, which has the Swift toolchain and the macOS SDK Kuvo Code builds
# against. The app itself, signed and in its disk image, is built only by release.yml (a tag, or a
# dry run from Actions › Release › Run workflow), not on every push.
jobs:
  checks:
    name: generated files and What's New
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('box/bun.lock') }}

      # The same Bun as build-box.sh's BUN_VERSION builds the same bytes on any system.
      - name: Check the box's types, and that its link, the agents bridge, the browser's tools and its routes' shapes are built from it
        working-directory: box
        env:
          BUN_RUNTIME_TRANSPILER_CACHE_PATH: "0"
        run: |
          bun install --frozen-lockfile
          bun run check
          ../scripts/build-box.sh --check
          ../scripts/route-shapes.sh --check
          ../scripts/build-agents.sh --check
          ../scripts/build-browser.sh --check

      - name: Check What's New is what CHANGELOG.md says
        run: |
          python3 scripts/whats-new.py --check
          python3 -m unittest discover -s scripts -p test_whats_new.py

  box:
    name: box and bridge (${{ matrix.system }})
    # The box runs on Macs (this Mac's own box, in macOS's sandbox) and on Linux machines (in
    # Landlock), so its tests run on both. The Linux run is new here: until it has passed on main,
    # its failures are only marked on its steps and don't fail the run (or hold up a release, which
    # calls this workflow); then take their continue-on-error out.
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: macOS
            runner: xcode-27
            blocking: true
          - system: Linux
            runner: ubuntu-24.04
            blocking: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The machines' bridge's tests run on Node, and start boxes with Bun.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('box/bun.lock') }}

      - name: Test the box's code (its link and the coding agents' bridge)
        continue-on-error: ${{ !matrix.blocking }}
        working-directory: box
        env:
          BUN_RUNTIME_TRANSPILER_CACHE_PATH: "0"
        run: |
          bun install --frozen-lockfile
          bun test

      # (After the box's install: its stand-in Claude Code loads the box's packages.)
      - name: Test the machines' bridge
        continue-on-error: ${{ !matrix.blocking }}
        working-directory: box
        run: node --test bridge-tests/*.test.js

  packages:
    name: Swift packages
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # SwiftPM's own cache of the packages' dependencies, so they're not cloned again. (Their
      # .build folders aren't kept: a checkout's fresh file times rebuild everything in them.)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('swift/*/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      # OpenCodeKit's launcher tests run Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Test OpenCodeKit
        working-directory: swift/OpenCodeKit
        run: swift test

      - name: Test UsageKit
        working-directory: swift/UsageKit
        run: swift test

      - name: Test KuvoClient
        working-directory: swift/KuvoClient
        run: swift test

      - name: Test KuvoLink
        working-directory: swift/KuvoLink
        run: swift test

      - name: Test scripts/heavy.sh, which takes turns for heavy jobs
        run: python3 -m unittest discover -s scripts -p test_heavy.py

  app:
    name: app
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # The Xcode project's packages, as cloned and downloaded. Resolving checks them against
      # Package.resolved below either way.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/SourcePackages
          key: source-packages-${{ runner.os }}-${{ hashFiles('swift/KuvoCode.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: source-packages-${{ runner.os }}-

      # Package.resolved is part of the build input: fail if building would
      # change it rather than testing a different dependency graph. Generating
      # the license file resolves the packages too.
      - name: Resolve dependencies and check THIRD_PARTY_LICENSES.txt
        run: |
          ./scripts/third-party-licenses.sh
          git diff --exit-code swift/KuvoCode.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          git diff --exit-code THIRD_PARTY_LICENSES.txt \
            || { echo "Run scripts/third-party-licenses.sh and commit the result." >&2; exit 1; }

      # The tests that run the bridge the app ships for real run it with this Bun.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('box/bun.lock') }}

      - name: Install the box's packages
        working-directory: box
        run: bun install --frozen-lockfile

      - name: Test the app
        run: ./scripts/test-app.sh
        env:
          # (The job's own time limit is what counts here, not heavy.sh's for a run on a busy Mac.)
          KUVO_HEAVY_LIMIT: "0"
