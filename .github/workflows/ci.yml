name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request, main, or a ci/ branch cancels the run it supersedes. A release's run
# (release.yml calls this workflow, and `github` is the caller's there, so github.workflow is
# "Release") is in a group of its own and is never cancelled.
concurrency:
  group: ${{ github.workflow == 'CI' && format('ci-{0}', github.ref) || format('ci-release-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.workflow == 'CI' }}

# Every job runs on GitHub's hosted runners, side by side. Xcode's runner images are named for the
# Xcode version they ship, which has the Swift toolchain the shared packages build with. The
# retired Swift Mac app (swift/MAC-APP-REFERENCE.md) isn't built or tested here; release.yml still
# builds it, only for the box release machines update from, until the box makes that itself.
jobs:
  checks:
    name: generated files
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('box/bun.lock') }}

      # The same Bun as build-box.sh's BUN_VERSION builds the same bytes on any system.
      - name: Check the box's types, and that its link, the agents bridge, the browser's tools and its routes' shapes are built from it
        working-directory: box
        env:
          BUN_RUNTIME_TRANSPILER_CACHE_PATH: "0"
        run: |
          bun install --frozen-lockfile
          bun run check
          ../scripts/build-box.sh --check
          ../scripts/route-shapes.sh --check
          ../scripts/build-agents.sh --check
          ../scripts/build-browser.sh --check

      # (scripts/whats-new.py writes the phone's What's New; the Mac app's whats-new.json is the
      # retired app's, written only as release.yml builds it.)
      - name: Test scripts/whats-new.py
        run: python3 -m unittest discover -s scripts -p test_whats_new.py

  box:
    name: box and bridge (${{ matrix.system }})
    # The box runs on Macs (this Mac's own box, in macOS's sandbox) and on Linux machines (in
    # Landlock), so its tests run on both. The Linux run is new here: until it has passed on main,
    # its failures are only marked on its steps and don't fail the run (or hold up a release, which
    # calls this workflow); then take their continue-on-error out.
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: macOS
            runner: xcode-27
            blocking: true
          - system: Linux
            runner: ubuntu-24.04
            blocking: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The machines' bridge's tests run on Node, and start boxes with Bun.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('box/bun.lock') }}

      - name: Test the box's code (its link and the coding agents' bridge)
        continue-on-error: ${{ !matrix.blocking }}
        working-directory: box
        env:
          BUN_RUNTIME_TRANSPILER_CACHE_PATH: "0"
        run: |
          bun install --frozen-lockfile
          bun test

      # (After the box's install: its stand-in Claude Code loads the box's packages.)
      - name: Test the machines' bridge
        continue-on-error: ${{ !matrix.blocking }}
        working-directory: box
        run: node --test bridge-tests/*.test.js

  packages:
    name: Swift packages
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # SwiftPM's own cache of the packages' dependencies, so they're not cloned again. (Their
      # .build folders aren't kept: a checkout's fresh file times rebuild everything in them.)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('swift/*/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      # OpenCodeKit's launcher tests run Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Test OpenCodeKit
        working-directory: swift/OpenCodeKit
        run: swift test

      - name: Test KuvoClient
        working-directory: swift/KuvoClient
        run: swift test

      - name: Test KuvoLink
        working-directory: swift/KuvoLink
        run: swift test

      - name: Test scripts/heavy.sh, which takes turns for heavy jobs
        run: python3 -m unittest discover -s scripts -p test_heavy.py
