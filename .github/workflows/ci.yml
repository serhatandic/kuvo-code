name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build and test
    # Xcode's runner images are named for the Xcode version they ship, which
    # has the Swift toolchain and the macOS SDK Kuvo Code builds against.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # Package.resolved is part of the build input: fail if building would
      # change it rather than testing a different dependency graph. Generating
      # the license file resolves the packages too.
      - name: Resolve dependencies and check THIRD_PARTY_LICENSES.txt
        run: |
          ./scripts/third-party-licenses.sh
          git diff --exit-code KuvoCode.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          git diff --exit-code THIRD_PARTY_LICENSES.txt \
            || { echo "Run scripts/third-party-licenses.sh and commit the result." >&2; exit 1; }

      - name: Test OpenCodeKit
        working-directory: Packages/OpenCodeKit
        run: swift test

      - name: Test UsageKit
        working-directory: Packages/UsageKit
        run: swift test

      # Before the machines' bridge's tests too: its route scenarios run the coding agents' bridge.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Test KuvoLink and the machines' bridge
        working-directory: Packages/KuvoLink
        run: |
          swift test
          node --test Tests/Bridge/*.test.js

      - name: Test the coding agents' bridge
        working-directory: Agents
        env:
          BUN_RUNTIME_TRANSPILER_CACHE_PATH: "0"
        run: |
          bun install --frozen-lockfile
          bun run check
          bun test

      - name: Check the bridge the app ships is built from its sources
        run: ./scripts/build-agents.sh --check

      - name: Test the app
        run: ./scripts/test-app.sh

      # The same scripts the release workflow runs, signed ad hoc here.
      - name: Build the app
        run: ./scripts/build-app.sh

      - name: Build the disk image
        run: |
          ./scripts/build-dmg.sh
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" build/KuvoCode.dmg >/dev/null
          test -d "$mount/Kuvo Code.app" || { echo "Kuvo Code.app is missing from the disk image" >&2; exit 1; }
          test "$(readlink "$mount/Applications")" = /Applications || { echo "The Applications link is missing" >&2; exit 1; }
          hdiutil detach "$mount" >/dev/null

      - name: Check the app bundle
        run: |
          app="build/Kuvo Code.app"
          for file in Assets.car AppIcon.icns LICENSE NOTICE THIRD_PARTY_LICENSES.txt prism-bundle.js buildDomTree.js kuvo-agents.js kuvo-browser.js; do
            test -f "$app/Contents/Resources/$file" || { echo "Missing $file in the app bundle" >&2; exit 1; }
          done
          test -d "$app/Contents/Frameworks/Sparkle.framework" || { echo "Sparkle isn't embedded" >&2; exit 1; }
          for key in SUFeedURL SUPublicEDKey; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$app/Contents/Info.plist" >/dev/null \
              || { echo "Info.plist is missing $key" >&2; exit 1; }
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = run.kuvo.code \
            || { echo "Unexpected bundle identifier" >&2; exit 1; }
          codesign --verify --strict --deep --verbose=2 "$app"
          codesign -d --verbose=2 "$app" 2>&1 | grep -q 'flags=.*runtime' \
            || { echo "The hardened runtime is off" >&2; exit 1; }
