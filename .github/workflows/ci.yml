name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build and test
    # Pushes to main, and release tags and dry runs from main (release.yml calls this; `github`
    # is the caller's there), run on the Mac mini's self-hosted runner. Everything else, every
    # pull request above all, runs on GitHub's: a pull request's workflow comes from its branch,
    # so code from a fork must never be offered the Mini. The runner refuses anything else too
    # (scripts/ci-runner/job-started.sh), and release.yml's build job picks the same way. The
    # repository variable KUVO_MINI set to `off` sends everything to GitHub's runners, for when
    # the Mini is away.
    # Xcode's runner images are named for the Xcode version they ship, which
    # has the Swift toolchain and the macOS SDK Kuvo Code builds against.
    runs-on: >-
      ${{ github.repository == 'serhatandic/kuvo-code'
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
          && vars.KUVO_MINI != 'off'
          && fromJSON('["self-hosted", "macOS", "ARM64", "kuvo-mini"]')
          || 'xcode-27' }}
    # The Mini has one runner: a hung step mustn't hold every run behind it for GitHub's six hours.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # Package.resolved is part of the build input: fail if building would
      # change it rather than testing a different dependency graph. Generating
      # the license file resolves the packages too.
      - name: Resolve dependencies and check THIRD_PARTY_LICENSES.txt
        run: |
          ./scripts/third-party-licenses.sh
          git diff --exit-code KuvoCode.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          git diff --exit-code THIRD_PARTY_LICENSES.txt \
            || { echo "Run scripts/third-party-licenses.sh and commit the result." >&2; exit 1; }

      # OpenCodeKit's launcher tests and the machines' bridge's tests run Node. GitHub's images
      # have one of their own; the Mac mini has none, so it's the same pinned one on both.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Test OpenCodeKit
        working-directory: Packages/OpenCodeKit
        run: swift test

      - name: Test UsageKit
        working-directory: Packages/UsageKit
        run: swift test

      - name: Test KuvoClient
        working-directory: Packages/KuvoClient
        run: swift test

      # Before the machines' bridge's tests too: its route scenarios run the coding agents' bridge.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Test the box's code (its link and the coding agents' bridge), and check its link and its routes' shapes are built from it
        working-directory: Packages/Box
        env:
          BUN_RUNTIME_TRANSPILER_CACHE_PATH: "0"
        run: |
          bun install --frozen-lockfile
          bun run check
          bun test
          ../../scripts/build-box.sh --check
          ../../scripts/route-shapes.sh --check

      - name: Check What's New is what CHANGELOG.md says
        run: |
          python3 scripts/whats-new.py --check
          python3 -m unittest discover -s scripts -p test_whats_new.py

      - name: Test scripts/heavy.sh, which takes turns for heavy jobs
        run: python3 -m unittest discover -s scripts -p test_heavy.py

      - name: Test KuvoLink and the machines' bridge
        working-directory: Packages/KuvoLink
        run: |
          swift test
          node --test Tests/Bridge/*.test.js

      - name: Check the bridge the app ships is built from its sources
        run: ./scripts/build-agents.sh --check

      - name: Test the app
        run: ./scripts/test-app.sh

      # The same scripts the release workflow runs, signed ad hoc here.
      - name: Build the app
        run: ./scripts/build-app.sh

      - name: Build the disk image
        run: |
          ./scripts/build-dmg.sh
          mount=$(mktemp -d)
          # Detached even when a check fails: the Mini keeps what a run leaves mounted.
          trap 'hdiutil detach "$mount" -force >/dev/null 2>&1 || true; rmdir "$mount" 2>/dev/null || true' EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" build/KuvoCode.dmg >/dev/null
          test -d "$mount/Kuvo Code.app" || { echo "Kuvo Code.app is missing from the disk image" >&2; exit 1; }
          test "$(readlink "$mount/Applications")" = /Applications || { echo "The Applications link is missing" >&2; exit 1; }
          hdiutil detach "$mount" >/dev/null

      - name: Check the app bundle
        run: |
          app="build/Kuvo Code.app"
          for file in Assets.car AppIcon.icns LICENSE NOTICE THIRD_PARTY_LICENSES.txt prism-bundle.js buildDomTree.js kuvo-agents.js kuvo-browser.js; do
            test -f "$app/Contents/Resources/$file" || { echo "Missing $file in the app bundle" >&2; exit 1; }
          done
          test -d "$app/Contents/Frameworks/Sparkle.framework" || { echo "Sparkle isn't embedded" >&2; exit 1; }
          for key in SUFeedURL SUPublicEDKey; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$app/Contents/Info.plist" >/dev/null \
              || { echo "Info.plist is missing $key" >&2; exit 1; }
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = run.kuvo.code \
            || { echo "Unexpected bundle identifier" >&2; exit 1; }
          codesign --verify --strict --deep --verbose=2 "$app"
          codesign -d --verbose=2 "$app" 2>&1 | grep -q 'flags=.*runtime' \
            || { echo "The hardened runtime is off" >&2; exit 1; }
