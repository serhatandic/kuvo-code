[package]
name = "kuvo_box"
description = "A client of a Kuvo box: finding it, its update gate, its session lists, conversations and typed messages"
edition.workspace = true
version.workspace = true
license-file.workspace = true
publish.workspace = true

# No GPUI here: the desktop client's screens use this, and so can any other Rust client.
[dependencies]
async-channel = "2.5"
base64 = "0.22"
getrandom = "0.3"
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
